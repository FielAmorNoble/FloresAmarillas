<title>Girasoles para ti</title>
<style>
  :root {
    --bg-top: #fff6e0;
    --bg-bottom: #ffdf8f;
    --sun-glow: #ffe6a3;
    --petal: #ffcf3f;
    --petal-tip: #fff2b0;
    --petal-shadow: #f2a01f;
    --seed: #7a4a26;
    --seed-dark: #4a2c16;
    --leaf: #5c8f3c;
    --leaf-dark: #3c6428;
    --stem: #588234;
    --hill: #6fa347;
    --hill-dark: #4f7f34;
    --ink: #4a3418;
    --ink-soft: #8a6a3c;
    --card-bg: #fffaf0;
    --card-border: #f0d9a0;
    --accent: #e8622c;
    --accent-ink: #fff8ec;
    --ribbon: #c1442c;
    --ribbon-dark: #92311e;
    --shadow: rgba(120, 80, 20, 0.18);
    --sun-core: #ffd75e;
    --sun-edge: #f6a623;
    --cloud: #fffaf0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #1c1409;
      --bg-bottom: #34220e;
      --sun-glow: #4a3417;
      --hill: #35521f;
      --hill-dark: #253a15;
      --ink: #f7ecd2;
      --ink-soft: #d8bd8a;
      --card-bg: #2a1f10;
      --card-border: #4a371c;
      --shadow: rgba(0, 0, 0, 0.4);
      --sun-core: #caa24a;
      --sun-edge: #8a6420;
      --cloud: #5c4726;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #1c1409;
    --bg-bottom: #34220e;
    --sun-glow: #4a3417;
    --hill: #35521f;
    --hill-dark: #253a15;
    --ink: #f7ecd2;
    --ink-soft: #d8bd8a;
    --card-bg: #2a1f10;
    --card-border: #4a371c;
    --shadow: rgba(0, 0, 0, 0.4);
    --sun-core: #caa24a;
    --sun-edge: #8a6420;
    --cloud: #5c4726;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--ink);
    font-family: "Quicksand", "Nunito", system-ui, sans-serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  .stage {
    position: relative;
    flex: 1;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top, 0px)) 20px max(24px, env(safe-area-inset-bottom, 0px));
    overflow: hidden;
  }

  .sky-decor {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .sun-glow {
    position: absolute;
    top: -80px;
    right: -60px;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--sun-glow) 0%, transparent 70%);
  }

  .sun-disc {
    position: absolute;
    top: -8px;
    right: 22px;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6d0, var(--sun-core) 55%, var(--sun-edge) 100%);
    box-shadow: 0 0 40px 8px var(--sun-glow);
    animation: sun-pulse 6s ease-in-out infinite;
  }

  @keyframes sun-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  .cloud, .cloud::before, .cloud::after {
    background: var(--cloud);
    border-radius: 50%;
  }
  .cloud {
    position: absolute;
    border-radius: 50px;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
  }

  .cloud-1 {
    top: 9%;
    left: 6%;
    width: 120px;
    height: 38px;
    animation: drift-a 20s ease-in-out infinite;
  }
  .cloud-1::before { width: 56px; height: 56px; top: -30px; left: 12px; }
  .cloud-1::after { width: 42px; height: 42px; top: -22px; right: 16px; }

  .cloud-2 {
    top: 17%;
    right: 10%;
    width: 86px;
    height: 28px;
    opacity: 0.85;
    animation: drift-b 16s ease-in-out infinite;
  }
  .cloud-2::before { width: 40px; height: 40px; top: -20px; left: 8px; }
  .cloud-2::after { width: 30px; height: 30px; top: -14px; right: 10px; }

  .cloud-3 {
    top: 5%;
    left: 42%;
    width: 64px;
    height: 22px;
    opacity: 0.7;
    animation: drift-a 24s ease-in-out infinite reverse;
  }
  .cloud-3::before { width: 30px; height: 30px; top: -15px; left: 6px; }
  .cloud-3::after { width: 22px; height: 22px; top: -10px; right: 8px; }

  @keyframes drift-a {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(20px); }
  }
  @keyframes drift-b {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-16px); }
  }

  /* ---------- Pregunta ---------- */
  #question-screen {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: 0 20px 50px var(--shadow);
    animation: card-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .emoji-flower {
    font-size: 54px;
    display: inline-block;
    animation: sway 3.2s ease-in-out infinite;
    transform-origin: 50% 90%;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 26px;
    line-height: 1.3;
    margin: 18px 0 8px;
    text-wrap: balance;
    font-weight: 600;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 26px;
  }

  .choices {
    display: flex;
    gap: 14px;
  }

  button {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    border-radius: 16px;
    padding: 14px 0;
    flex: 1;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  button:active { transform: scale(0.96); }

  #yes-btn {
    background: linear-gradient(180deg, var(--petal) 0%, var(--petal-shadow) 100%);
    color: #5a3a10;
    box-shadow: 0 8px 18px rgba(230, 160, 20, 0.4);
  }
  #yes-btn:hover { filter: brightness(1.05); }

  #no-btn {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--card-border);
  }
  #no-btn:hover { filter: brightness(0.97); }

  /* ---------- Ramo ---------- */
  #bouquet-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    padding: 24px 16px;
  }

  #bouquet-svg {
    width: min(94vw, 520px);
    height: auto;
    display: block;
    position: relative;
    z-index: 2;
    overflow: visible;
  }

  .stem-path { fill: none; stroke: var(--stem); stroke-width: 6; stroke-linecap: round; }
  .leaf { fill: var(--leaf); }

  .petal { fill: url(#petalGrad); }
  .seed-bg { fill: url(#seedGrad); }
  .seed-dot { fill: var(--seed-dark); opacity: 0.55; }

  .flower-inner, .leaf-inner {
    opacity: 0;
  }

  .ribbon-group { opacity: 0; }

  #message {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 0 24px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  #message.show { opacity: 1; transform: translateY(0); }

  #message h2 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 30px;
    margin: 0 0 6px;
    color: var(--ink);
    text-wrap: balance;
  }

  #message p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 15px;
  }

  .petal-fall {
    position: absolute;
    top: -10%;
    font-size: 18px;
    z-index: 1;
    opacity: 0.9;
    pointer-events: none;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to { transform: translateY(115vh) rotate(340deg); opacity: 0.2; }
  }

  /* ---------- Cierre ---------- */
  #closed-screen {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 320px;
  }

  #closed-screen .emoji-flower { font-size: 44px; animation: none; }

  #closed-screen h1 { margin-top: 14px; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<div class="stage" id="stage">
  <div class="sky-decor" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="sun-disc"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <section id="question-screen">
    <span class="emoji-flower" aria-hidden="true">🌻</span>
    <h1>¿Te gustarían unas flores amarillas?</h1>
    <p class="subtitle">Feliz día del amor y la amistad</p>
    <div class="choices">
      <button id="yes-btn">Sí</button>
      <button id="no-btn">No</button>
    </div>
  </section>

  <section id="bouquet-screen" hidden>
    <svg id="bouquet-svg" viewBox="0 0 460 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs>
        <radialGradient id="petalGrad" cx="35%" cy="25%" r="75%">
          <stop offset="0%" stop-color="var(--petal-tip)"/>
          <stop offset="60%" stop-color="var(--petal)"/>
          <stop offset="100%" stop-color="var(--petal-shadow)"/>
        </radialGradient>
        <radialGradient id="seedGrad" cx="40%" cy="35%" r="70%">
          <stop offset="0%" stop-color="var(--seed)"/>
          <stop offset="100%" stop-color="var(--seed-dark)"/>
        </radialGradient>
      </defs>
      <g id="stems"></g>
      <g id="leaves"></g>
      <g id="ribbon"></g>
      <g id="flowers"></g>
    </svg>

    <div id="message">
      <h2>Espero te gusten 🌻💛</h2>
      <p>Feliz día del amor y la amistad</p>
    </div>
  </section>

  <section id="closed-screen" hidden>
    <span class="emoji-flower" aria-hidden="true">💛</span>
    <h1>Está bien</h1>
    <p class="subtitle">Puedes cerrar esta pestaña.</p>
  </section>
</div>

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var yesBtn = document.getElementById("yes-btn");
  var noBtn = document.getElementById("no-btn");
  var questionScreen = document.getElementById("question-screen");
  var bouquetScreen = document.getElementById("bouquet-screen");
  var closedScreen = document.getElementById("closed-screen");
  var messageEl = document.getElementById("message");
  var stage = document.getElementById("stage");

  noBtn.addEventListener("click", function () {
    window.close();
    setTimeout(function () {
      questionScreen.hidden = true;
      closedScreen.hidden = false;
    }, 250);
  });

  yesBtn.addEventListener("click", function () {
    questionScreen.hidden = true;
    bouquetScreen.hidden = false;
    growBouquet();
  });

  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function buildFlowerHead(cx, cy, tilt) {
    var outer = el("g", { transform: "translate(" + cx + "," + cy + ") rotate(" + tilt + ")" });
    var inner = el("g", { class: "flower-inner" });
    outer.appendChild(inner);
    var petalCount = 12;
    for (var i = 0; i < petalCount; i++) {
      var angle = (360 / petalCount) * i;
      var p = el("ellipse", {
        class: "petal",
        cx: 0, cy: -23, rx: 7, ry: 15,
        transform: "rotate(" + angle + ")"
      });
      inner.appendChild(p);
    }
    var seedR = 13;
    var seedBg = el("circle", { class: "seed-bg", cx: 0, cy: 0, r: seedR });
    inner.appendChild(seedBg);
    var dots = 34;
    var golden = 137.508 * Math.PI / 180;
    for (var d = 0; d < dots; d++) {
      var r = seedR * 0.92 * Math.sqrt(d / dots);
      var a = d * golden;
      var dx = r * Math.cos(a);
      var dy = r * Math.sin(a);
      var dot = el("circle", { class: "seed-dot", cx: dx, cy: dy, r: 1.15 });
      inner.appendChild(dot);
    }
    return { outer: outer, inner: inner };
  }

  function buildLeaf(x, y, angleDeg, flip) {
    var outer = el("g", { transform: "translate(" + x + "," + y + ") rotate(" + angleDeg + ")" });
    var leaf = el("path", {
      class: "leaf leaf-inner",
      d: "M0,0 C 14," + (flip ? -22 : 22) + " 34," + (flip ? -18 : 18) + " 40,0 " +
         "C 34," + (flip ? 18 : -18) + " 14," + (flip ? 22 : -22) + " 0,0 Z"
    });
    outer.appendChild(leaf);
    return { outer: outer, inner: leaf };
  }

  function growBouquet() {
    var stemsG = document.getElementById("stems");
    var leavesG = document.getElementById("leaves");
    var flowersG = document.getElementById("flowers");
    var ribbonG = document.getElementById("ribbon");

    var tieX = 230, tieY = 385;
    var count = 9;
    var minAngle = -48, maxAngle = 48;
    var stemEls = [];
    var flowerData = [];

    for (var i = 0; i < count; i++) {
      var t = i / (count - 1);
      var angle = minAngle + (maxAngle - minAngle) * t;
      var rad = angle * Math.PI / 180;
      var dist = Math.abs(i - (count - 1) / 2);
      var length = 235 - dist * 20;
      var ex = tieX + length * Math.sin(rad);
      var ey = tieY - length * Math.cos(rad);
      var curveKick = Math.sin(rad) * 18;
      var cx = tieX + (length * 0.52) * Math.sin(rad) + curveKick;
      var cy = tieY - (length * 0.52) * Math.cos(rad);

      var path = el("path", {
        class: "stem-path",
        d: "M " + tieX + "," + tieY + " Q " + cx + "," + cy + " " + ex + "," + ey
      });
      stemsG.appendChild(path);
      stemEls.push(path);

      var lt = 0.55;
      var lx = (1 - lt) * (1 - lt) * tieX + 2 * (1 - lt) * lt * cx + lt * lt * ex;
      var ly = (1 - lt) * (1 - lt) * tieY + 2 * (1 - lt) * lt * cy + lt * lt * ey;
      var leaf = buildLeaf(lx, ly, angle * 1.3 + (i % 2 ? 10 : -190), i % 2 === 0);
      var flower = buildFlowerHead(ex, ey, angle * 0.7);

      flowerData.push({
        flower: flower.inner, leaf: leaf.inner,
        flowerOuter: flower.outer, leafOuter: leaf.outer,
        length: length
      });
    }

    /* Draw the tallest, center-most flowers last so they layer in front
       of the shorter side ones, like a hand-tied bouquet. */
    flowerData.slice().sort(function (a, b) { return a.length - b.length; })
      .forEach(function (fd) {
        leavesG.appendChild(fd.leafOuter);
        flowersG.appendChild(fd.flowerOuter);
      });

    ribbonG.setAttribute("class", "ribbon-group");
    ribbonG.style.transformOrigin = "230px 388px";
    var ribbon = el("path", {
      d: "M 195,375 Q 230,405 265,375 Q 270,388 230,398 Q 190,388 195,375 Z",
      fill: "var(--ribbon)"
    });
    ribbonG.appendChild(ribbon);
    var ribbonShade = el("path", {
      d: "M 205,382 Q 230,396 255,382 Q 230,392 205,382 Z",
      fill: "var(--ribbon-dark)"
    });
    ribbonG.appendChild(ribbonShade);

    if (reduceMotion) {
      stemEls.forEach(function (p) { p.style.strokeDasharray = "none"; });
      flowerData.forEach(function (fd) {
        fd.flower.style.opacity = 1;
        fd.leaf.style.opacity = 1;
      });
      ribbonG.style.opacity = 1;
      showMessage();
      return;
    }

    var stepDelay = 160;
    var stemDuration = 650;
    var lastFinish = 0;

    stemEls.forEach(function (path, i) {
      var len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      var delay = i * stepDelay;
      var anim = path.animate(
        [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { duration: stemDuration, delay: delay, easing: "ease-out", fill: "forwards" }
      );

      var fd = flowerData[i];
      var leafAnim = fd.leaf.animate(
        [{ opacity: 0, transform: "scale(0.4)" }, { opacity: 1, transform: "scale(1)" }],
        { duration: 400, delay: delay + stemDuration * 0.5, easing: "ease-out", fill: "forwards" }
      );
      var flowerAnim = fd.flower.animate(
        [
          { opacity: 0, transform: "scale(0.2) rotate(-25deg)" },
          { opacity: 1, transform: "scale(1.1) rotate(4deg)" },
          { opacity: 1, transform: "scale(1) rotate(0deg)" }
        ],
        { duration: 560, delay: delay + stemDuration * 0.85, easing: "cubic-bezier(.34,1.56,.64,1)", fill: "forwards" }
      );

      var finish = delay + stemDuration * 0.85 + 560;
      if (finish > lastFinish) lastFinish = finish;
    });

    setTimeout(function () {
      ribbonG.animate(
        [{ opacity: 0, transform: "scale(0.6)" }, { opacity: 1, transform: "scale(1)" }],
        { duration: 400, easing: "ease-out", fill: "forwards" }
      );
      ribbonG.style.opacity = 1;
    }, lastFinish);

    setTimeout(function () {
      showMessage();
      spawnPetals();
    }, lastFinish + 500);
  }

  function showMessage() {
    messageEl.classList.add("show");
  }

  function spawnPetals() {
    var count = 10;
    for (var i = 0; i < count; i++) {
      (function (idx) {
        setTimeout(function () {
          var p = document.createElement("div");
          p.className = "petal-fall";
          p.textContent = "🌼";
          p.style.left = (5 + Math.random() * 90) + "%";
          p.style.fontSize = (14 + Math.random() * 12) + "px";
          p.style.animationDuration = (4 + Math.random() * 3) + "s";
          stage.appendChild(p);
          setTimeout(function () { p.remove(); }, 8000);
        }, idx * 260);
      })(i);
    }
  }
})();
</script>
